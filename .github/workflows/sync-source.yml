name: Sync source repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy upstream source files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/blackbrowser-source
          git clone --depth 1 https://github.com/TomasThrawat/BlackBrowser.git /tmp/blackbrowser-source

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             /tmp/blackbrowser-source/ ./

          rm -rf .github/workflows/sync-source.yml 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy BlackBrowser source exactly" || true
          git push
