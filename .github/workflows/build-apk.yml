name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLACKBROWSER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blackbrowser-release.p12"
          test -s "$RUNNER_TEMP/blackbrowser-release.p12"

      - name: Build signed release APK
        env:
          BLACKBROWSER_KEYSTORE_PATH: ${{ runner.temp }}/blackbrowser-release.p12
          BLACKBROWSER_KEYSTORE_PASSWORD: ${{ secrets.BLACKBROWSER_KEYSTORE_PASSWORD }}
          BLACKBROWSER_KEY_ALIAS: ${{ secrets.BLACKBROWSER_KEY_ALIAS }}
          BLACKBROWSER_KEY_PASSWORD: ${{ secrets.BLACKBROWSER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
